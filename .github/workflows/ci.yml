name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - integration/story-connect-backend

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python 3.10)
    runs-on: ubuntu-latest
    env:
      ENABLE_META: "0"
      ENABLE_BASETEN: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Coq for proof-refinement tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y coq

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run complete backend test suite, including provider safety and attribution
        working-directory: backend
        run: python -m pytest -q tests

  frontend:
    name: Frontend tests and production build (Node.js 22.6)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22.6
        uses: actions/setup-node@v4
        with:
          node-version: "22.6.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Run frontend test suite
        run: npm test

      - name: Build production frontend
        run: npm run build

  workflow-whitespace:
    name: Workflow whitespace check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check only the workflow file for whitespace errors
        run: git diff --check origin/main...HEAD -- .github/workflows/ci.yml
